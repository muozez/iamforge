version: 2

project_name: iamforge

before:
  hooks:
    - go mod tidy

builds:
  - id: iamforge
    main: ./cmd/iamforge
    binary: iamforge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/muozez/iamforge/internal/cli.Version={{ .Version }}
      - -X github.com/muozez/iamforge/internal/cli.Commit={{ .Commit }}
      - -X github.com/muozez/iamforge/internal/cli.Date={{ .Date }}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

